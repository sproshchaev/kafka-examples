# 3. docker-compose-kraft1.yml -> docker-compose.kraft-1node.yml
# Конфигурация docker-compose.yml с одним контроллером и одним брокером в режиме KRaft
# kafka-platform/docker/kraft-single-broker.yml
# 1) kafka
# 2) Kafdrop

version: "3"
services:
  # Единственный узел, выполняющий обе роли: controller и broker
  kafka-single:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-single
    container_name: kafka-single
    ports:
      - "9092:9092"      # Для внутреннего общения (PLAINTEXT)
      - "9093:9094"      # Для внешнего общения (PLAINTEXT_HOST) - Изменено: хост 9093 -> контейнер 9094
      - "9101:9101"      # JMX порт
    environment:
      # Уникальный ID кластера (генерируется один раз)
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      # Роли этого узла - и контроллер, и брокер
      KAFKA_PROCESS_ROLES: "broker,controller"

      # Уникальный ID узла
      KAFKA_NODE_ID: 1

      # Слушатели:
      # - CONTROLLER для внутренней коммуникации контроллеров (на порту 9093)
      # - PLAINTEXT для внутренней коммуникации брокеров (на порту 9092)
      # - PLAINTEXT_HOST для внешних клиентов (на порту 9094)
      # Изменено: PLAINTEXT_HOST теперь на 9094
      KAFKA_LISTENERS: "PLAINTEXT://kafka-single:9092,CONTROLLER://kafka-single:9093,PLAINTEXT_HOST://0.0.0.0:9094"

      # Карта соответствия имен слушателей и протоколов безопасности
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      # Имя слушателя для контроллера
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # Имя слушателя для внутренней коммуникации между брокерами
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # Адреса, по которым клиенты могут подключаться к брокеру
      # Изменено: Внешний адрес теперь localhost:9093
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-single:9092,PLAINTEXT_HOST://localhost:9093"

      # Участники кворума контроллеров (в данном случае только один)
      # Контроллер слушает на порту 9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-single:9093"

      # Фактор репликации для служебных топиков (поскольку у нас 1 брокер, ставим 1)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Включаем автоматическое создание топиков
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # JMX настройки
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    container_name: kafdrop-single
    ports:
      - "9000:9000"
    environment:
      # Kafdrop подключается к внутреннему слушателю брокера
      KAFKA_BROKERCONNECT: "kafka-single:9092"
      JVM_OPTS: "-Xms32M -Xmx64M"
      SERVER_SERVLET_CONTEXT_PATH: "/"
    depends_on:
      - kafka-single