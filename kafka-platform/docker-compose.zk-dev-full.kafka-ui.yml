# 2.1. docker-compose.zk-dev-full.kafka-ui.yml
# Мой из kafka-for-developers
#  1) zookeeper Порт ZOOKEEPER_CLIENT_PORT: 2181
#  2) Брокер #1 Порт PLAINTEXT_HOST://localhost:9093
#  3) kafka-ui Порт http://localhost:8088/
#  4) schema-registry Порт http://localhost:8081/ (нет интерфейса - так и надо! Проверить: curl http://localhost:8081/config -> "{"compatibilityLevel":"BACKWARD"}% ")
#  5) kafka-rest Порт http://localhost:8082
#  6) schema-registry-ui Порт http://localhost:8001/

version: '3.8'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "9093:9093"

  # Заменяем kafdrop на kafka-ui
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:master
    ports:
      - "8088:8080" # kafka-ui будет доступен по адресу http://localhost:8088
    depends_on:
      - kafka
      - schema-registry
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # Подключение к брокеру Kafka используя внутреннее имя сервиса в Docker
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: PLAINTEXT://kafka:9092
      # Подключение к Schema Registry используя внутреннее имя сервиса в Docker
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: 'true'

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    hostname: schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # Используем BOOTSTRAP_SERVERS вместо устаревшего CONNECTION_URL
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_DEBUG: 'true'
    depends_on:
      - kafka

  schema-registry-ui:
    image: landoop/schema-registry-ui:0.9.5
    container_name: schema-registry-ui
    depends_on:
      - schema-registry
    ports:
      - "8001:8000"
    environment:
      SCHEMAREGISTRY_URL: http://schema-registry:8081
      PROXY: 'true'
    healthcheck:
      test: 'wget --quiet --tries=1 --spider http://localhost:8000 || exit 1'

  kafka-rest:
    image: confluentinc/cp-kafka-rest:7.6.1
    container_name: kafka-rest
    hostname: kafka-rest
    ports:
      - "8082:8082"
    environment:
      # Подключение к брокеру Kafka используя внутреннее имя сервиса в Docker
      KAFKA_REST_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      KAFKA_REST_HOST_NAME: kafka-rest
      KAFKA_REST_LISTENERS: http://0.0.0.0:8082
      # Подключение к Schema Registry используя внутреннее имя сервиса в Docker
      KAFKA_REST_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_REST_DEBUG: 'true'
    depends_on:
      - kafka
      - schema-registry